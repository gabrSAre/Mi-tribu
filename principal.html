<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Tribe</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wdth,wght@62.5..100,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/stylePrincipal.css">

  </head>
  <body>
    <header>
        <div id="h-container">
            <div id="logo">
                <img src="/img/LogoSmal.png" alt="Logo de My Tribe" width="120px">
            </div>
            <div id="nav">
                <div class="icon">
                    <a href="#"><img src="/img/inicio.png" alt="Imagen de Pluma tallada en madera" width="100px"></a>
                    <a href="#" class="textoNav">Inicio</a>
                </div>
                <div class="icon">
                        <a href="#"><img src="/img/Perfil.png" alt="Imagen de rostro de indio tallada en madera" width="100px"></a>
                        <a href="#" class="textoNav">Perfil</a>
                </div>
                    
                 <div class="icon">
                        <a href="#"><img src="/img/Tribu.png" alt="Imagen de choza de indio en estilo de madera tallada" width="100px"></a>
                        <a href="#" class="textoNav">Tribu</a>
                </div>

                <div class="icon">
                        <a href="#"><img src="/img/salir.png" alt="Imagen de indio corriendo, imagen tallada en madera" width="100px"></a>
                        <a href="#" class="textoNav">Salir</a>
                </div>
            </div>
        </div>
    </header>



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
