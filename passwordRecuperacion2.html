<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tribe</title>
    <link rel="stylesheet" href="css/style-pasword2.css">
</head>

<body>
    <div class="container">
        <h1>Ingresa el código de seguridad</h1>
        <form action="index.html">
            <div class="campos">
                <label for="number">Código</label>
                <input type="number" placeholder="123..." required id="number">
            </div>
            <div class="campos">
                <label for="password">Nueva contraseña</label>
                <input type="password" minlength="8" placeholder="123..." required>
            </div>

             <div class="campos">
                <label for="password">Repita la contraseña</label>
                <input type="password" minlength="8" placeholder="123..." required>
            </div>
            <button type="submit" class="boton">Continuar</button>   
       </form>
    </div>
</body>
</html>
