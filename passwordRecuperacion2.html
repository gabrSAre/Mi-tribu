<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style-pasword2.css"> <!-- Asegúrate de crear este archivo -->
</head>

<body>
    <div class="container">
        <div class="caja">
            <h1>Recupera tu contraseña</h1>
            <form action="index.html" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="username">Codigo</label>
                    <input type="text" id="email" name="email" placeholder="123..." required>
                </div>
                 <div class="form-group">
                    <label for="username">Nueva contraseña</label>
                    <input type="text" id="email" name="email" placeholder="abc*44..." required>
                </div>
                 <div class="form-group">
                    <label for="username">Repita la contraseña</label>
                    <input type="text" id="email" name="email" placeholder="abc*44..." required>
                </div>

                <button type="submit" data-bs-toggle="modal" data-bs-target="#exampleModal">Siguiente</button>
            </form>
        </div>
    </div>
    <a href="passwordRecuperacion.html">Atrás</a>




   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
