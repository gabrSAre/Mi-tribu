<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de contraseña</title>
    <link rel="stylesheet" href="/css/style-password.css"> <!-- Asegúrate de crear este archivo -->
</head>

<body>
    <div class="container">
        <div class="caja">
            <h1>Recupera tu contraseña</h1>
            <form action="/passwordRecuperacion2.html" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label for="username">Ingresa tu correo instituciona</label>
                    <input type="text" id="email" name="email" placeholder="user@cesde.net" required>
                </div>
                <button type="submit">Siguiente</button>
            </form>
        </div>
    </div>
    <a href="/index.html">Atrás</a>
</body>

</html>
