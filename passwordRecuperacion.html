<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperación de contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-rbsA2VBKQhggwzxH7pPCaAqO46MgnOM80zW1RWuH61DGLwZJEdK2Kadq2F9CUG65" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style-password.css"> <!-- Asegúrate de crear este archivo -->
</head>

<body>
    <div class="container">
        <div class="caja">
            <h1>Recupera tu contraseña</h1>
            <form enctype="multipart/form-data">
                <div class="form-group">
                    <label for="username">Ingresa tu correo institucional</label>
                    <input type="text" id="email" name="email" placeholder="user@cesde.net" required>
                </div>
                <button type="submit" data-bs-toggle="modal" data-bs-target="#exampleModal">Siguiente</button>
            </form>
        </div>
    </div>
    <a href="/index.html">Atrás</a>



    <!-- Modal -->
    <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="exampleModalLabel">Repueración de contraseña</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <h2>Su código de recuperación de contraseña es :<span class="text-primary">123fAS//0%$</span></h2>
                </div>
                <div class="modal-footer">
                    <a href="passwordRecuperacion2.html" class="btn btn-primary" >Siguiente</a>
                </div>
            </div>
        </div>
    </div>


   

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-kenU1KFdBIe4zVF0s0G1M5b4hcpxyD9F7jL+jjXkk+Q2h455rYXK/7HAuoJl+0I4"
        crossorigin="anonymous"></script>
</body>

</html>
