<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tribu</title>
   <link rel="stylesheet" href="css/crear una tribu.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wdth,wght@62.5..100,100..900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="contenedor">
        <h1>Crear Nueva Tribu</h1>

        <form id="formTribu">

            <label for="nombre">Nombre de la Tribu:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe el nombre de tu tribu" required>

            <label for="ciudad">Ciudad Origen:</label>
            <select id="ciudad" name="ciudad" required>
                <option value="">-- Selecciona una ciudad --</option>
                <option value="medellin">Medellín</option>
                <option value="bogota">Bogotá</option>
                <option value="cali">Cali</option>
                <option value="barranquilla">Barranquilla</option>
                <option value="cartagena">Cartagena</option>
                <option value="bucaramanga">Bucaramanga</option>
                <option value="pereira">Pereira</option>
                <option value="manizales">Manizales</option>
                <option value="ibague">Ibagué</option>
                <option value="santa_marta">Santa Marta</option>
            </select>

            <label for="sede">Sede del CESDE:</label>
            <select id="sede" name="sede" required>
                <option value="">-- Selecciona una sede --</option>
                <option value="cesde_centro">CESDE Centro</option>
                <option value="cesde_norte">CESDE Norte</option>
                <option value="cesde_sur">CESDE Sur</option>
                <option value="cesde_occidente">CESDE Occidente</option>
                <option value="cesde_bello">CESDE Bello</option>
                <option value="cesde_envigado">CESDE Envigado</option>
                <option value="cesde_itagui">CESDE Itagüí</option>
                <option value="cesde_rionegro">CESDE Rionegro</option>
            </select>

            <label>Hobbies / Foco de la Tribu:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobbies" value="programacion"> Programación</label>
                <label><input type="checkbox" name="hobbies" value="diseno"> Diseño</label>
                <label><input type="checkbox" name="hobbies" value="musica"> Música</label>
                <label><input type="checkbox" name="hobbies" value="deportes"> Deportes</label>
                <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
                <label><input type="checkbox" name="hobbies" value="fotografia"> Fotografía</label>
                <label><input type="checkbox" name="hobbies" value="lectura"> Lectura</label>
                <label><input type="checkbox" name="hobbies" value="cocina"> Cocina</label>
                <label><input type="checkbox" name="hobbies" value="robotica"> Robótica</label>
                <label><input type="checkbox" name="hobbies" value="emprendimiento"> Emprendimiento</label>
            </div>

            <label>Foto o Logo Representativo:</label>
            <div class="imagen-upload">
                <input type="file" id="logo" name="logo" accept="image/*">
            </div>

            <label>Imagen de Portada:</label>
            <div class="imagen-upload">
                <input type="file" id="portada" name="portada" accept="image/*">
            </div>

            <label for="descripcion">Descripción Grupal: <span class="opcional">(opcional)</span></label>
            <textarea id="descripcion" name="descripcion" placeholder="Cuenta algo sobre tu tribu..."></textarea>

            <button type="submit" class="btn-crear">Crear Tribu</button>

        </form>
    </div>
</body>
</html>
