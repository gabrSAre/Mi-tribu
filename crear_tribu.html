<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Tribu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .contenedor {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
            color: #444;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 5px;
        }
        .checkbox-group label {
            font-weight: normal;
            margin-top: 0;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .imagen-upload {
            margin-top: 5px;
        }
        .imagen-upload input[type="file"] {
            width: 100%;
            padding: 8px;
            border: 1px dashed #ccc;
            background-color: #fafafa;
            border-radius: 4px;
        }
        .preview-img {
            max-width: 200px;
            max-height: 150px;
            margin-top: 10px;
            border-radius: 4px;
            display: none;
        }
        .preview-portada {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 4px;
            display: none;
        }
        .btn-crear {
            display: block;
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-crear:hover {
            background-color: #45a049;
        }
        .opcional {
            font-weight: normal;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h1>Crear Nueva Tribu</h1>

        <form id="formTribu">

            <label for="nombre">Nombre de la Tribu:</label>
            <input type="text" id="nombre" name="nombre" placeholder="Escribe el nombre de tu tribu" required>

            <label for="ciudad">Ciudad Origen:</label>
            <select id="ciudad" name="ciudad" required>
                <option value="">-- Selecciona una ciudad --</option>
                <option value="medellin">Medellín</option>
                <option value="bogota">Bogotá</option>
                <option value="cali">Cali</option>
                <option value="barranquilla">Barranquilla</option>
                <option value="cartagena">Cartagena</option>
                <option value="bucaramanga">Bucaramanga</option>
                <option value="pereira">Pereira</option>
                <option value="manizales">Manizales</option>
                <option value="ibague">Ibagué</option>
                <option value="santa_marta">Santa Marta</option>
            </select>

            <label for="sede">Sede del CESDE:</label>
            <select id="sede" name="sede" required>
                <option value="">-- Selecciona una sede --</option>
                <option value="cesde_centro">CESDE Centro</option>
                <option value="cesde_norte">CESDE Norte</option>
                <option value="cesde_sur">CESDE Sur</option>
                <option value="cesde_occidente">CESDE Occidente</option>
                <option value="cesde_bello">CESDE Bello</option>
                <option value="cesde_envigado">CESDE Envigado</option>
                <option value="cesde_itagui">CESDE Itagüí</option>
                <option value="cesde_rionegro">CESDE Rionegro</option>
            </select>

            <label>Hobbies / Foco de la Tribu:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobbies" value="programacion"> Programación</label>
                <label><input type="checkbox" name="hobbies" value="diseno"> Diseño</label>
                <label><input type="checkbox" name="hobbies" value="musica"> Música</label>
                <label><input type="checkbox" name="hobbies" value="deportes"> Deportes</label>
                <label><input type="checkbox" name="hobbies" value="gaming"> Gaming</label>
                <label><input type="checkbox" name="hobbies" value="fotografia"> Fotografía</label>
                <label><input type="checkbox" name="hobbies" value="lectura"> Lectura</label>
                <label><input type="checkbox" name="hobbies" value="cocina"> Cocina</label>
                <label><input type="checkbox" name="hobbies" value="robotica"> Robótica</label>
                <label><input type="checkbox" name="hobbies" value="emprendimiento"> Emprendimiento</label>
            </div>

            <label>Foto o Logo Representativo:</label>
            <div class="imagen-upload">
                <input type="file" id="logo" name="logo" accept="image/*">
                <img id="previewLogo" class="preview-img" alt="Vista previa del logo">
            </div>

            <label>Imagen de Portada:</label>
            <div class="imagen-upload">
                <input type="file" id="portada" name="portada" accept="image/*">
                <img id="previewPortada" class="preview-portada" alt="Vista previa de portada">
            </div>

            <label for="descripcion">Descripción Grupal: <span class="opcional">(opcional)</span></label>
            <textarea id="descripcion" name="descripcion" placeholder="Cuenta algo sobre tu tribu..."></textarea>

            <button type="submit" class="btn-crear">Crear Tribu</button>

        </form>
    </div>

    <script>
        // Vista previa del logo
        document.getElementById('logo').addEventListener('change', function(e) {
            const archivo = e.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(evento) {
                    const preview = document.getElementById('previewLogo');
                    preview.src = evento.target.result;
                    preview.style.display = 'block';
                };
                lector.readAsDataURL(archivo);
            }
        });

        // Vista previa de la portada
        document.getElementById('portada').addEventListener('change', function(e) {
            const archivo = e.target.files[0];
            if (archivo) {
                const lector = new FileReader();
                lector.onload = function(evento) {
                    const preview = document.getElementById('previewPortada');
                    preview.src = evento.target.result;
                    preview.style.display = 'block';
                };
                lector.readAsDataURL(archivo);
            }
        });

        // Enviar formulario
        document.getElementById('formTribu').addEventListener('submit', function(e) {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const ciudad = document.getElementById('ciudad').value;
            const sede = document.getElementById('sede').value;
            const descripcion = document.getElementById('descripcion').value;

            const hobbiesMarcados = document.querySelectorAll('input[name="hobbies"]:checked');
            const hobbies = [];
            hobbiesMarcados.forEach(function(h) {
                hobbies.push(h.value);
            });

            if (hobbies.length === 0) {
                alert('Por favor selecciona al menos un hobbie o foco.');
                return;
            }

            alert('¡Tribu creada con éxito!\n\n' +
                  'Nombre: ' + nombre + '\n' +
                  'Ciudad: ' + ciudad + '\n' +
                  'Sede: ' + sede + '\n' +
                  'Hobbies: ' + hobbies.join(', ') + '\n' +
                  'Descripción: ' + (descripcion || 'Sin descripción'));
        });
    </script>

</body>
</html>
